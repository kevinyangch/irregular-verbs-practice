<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>Irregular Verbs 單字練習（單題版）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- PWA / Web App 設定（Android / iOS，全螢幕） -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="style.css" />
  <script src="main.js" defer></script>
</head>
<body>
  <h1>Irregular Verbs 與比較級練習</h1>
  <div class="subtitle">
    每次隨機顯示一個原形（動詞或形容詞），按「確認發音(原形)」聽原形發音，
    按「顯示三態/比較級」看完整變化，再按「下一題」換題目。
  </div>

  <div class="card">
    <div id="wordBase" class="word-base">—</div>
    <div id="wordMeaning" class="word-meaning">請勾選題目範圍後，按「下一題」開始練習。</div>

    <div id="forms" class="forms"></div>

    <div class="buttons">
      <!-- 第一個按鈕：確認發音(原形) -->
      <button class="btn-primary" id="btnSpeakBase">確認發音(原形)</button>
      <!-- 第二個按鈕：顯示三態 / 比較級 -->
      <button class="btn-secondary" id="btnShowForms">顯示三態／比較級</button>
      <!-- 第三個按鈕：下一題 -->
      <button class="btn-outline" id="btnNext">下一題</button>
    </div>

    <div class="options">
      <label class="option-item">
        <input type="checkbox" id="optVerbs" checked />
        包含不規則動詞三態題目
      </label>

      <label class="option-item">
        <input type="checkbox" id="optComparatives" checked />
        包含形容詞比較級題目
      </label>
    </div>

    <div class="info">
      小提示：<br />
      勾選哪一種題目，就會從那一類的題庫隨機出題。<br />
      「確認發音(原形)」只念 Base，「顯示三態／比較級」會顯示變化並自動念完整形式。
    </div>
  </div>
</body>
</html>

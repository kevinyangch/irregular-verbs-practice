<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>三態與比較級練習（分類版）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- PWA / Web App 設定（Android / iOS，全螢幕） -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="style.css" />
  <script src="main.js" defer></script>
</head>
<body>
  <h1>三態與比較級練習</h1>
  <div class="subtitle">
    勾選 AAA／ABA／ABB／比較級四種題目範圍，每次隨機顯示一個原形，
    按「確認發音(原形)」聽原形，按「顯示三態／比較級」看完整變化，再按「下一題」換題目。
  </div>

  <div class="card">
    <div id="wordBase" class="word-base">—</div>
    <div id="wordMeaning" class="word-meaning">
      請勾選題目範圍後，按「下一題」開始練習。
    </div>

    <div id="forms" class="forms"></div>

    <div class="buttons">
      <!-- 第一個按鈕：確認發音(原形) -->
      <button class="btn-primary" id="btnSpeakBase">確認發音(原形)</button>
      <!-- 第二個按鈕：顯示三態 / 比較級 -->
      <button class="btn-secondary" id="btnShowForms">顯示三態／比較級</button>
      <!-- 第三個按鈕：下一題 -->
      <button class="btn-outline" id="btnNext">下一題</button>
    </div>

    <div class="options">
      <label class="option-item">
        <input type="checkbox" id="optAAA" checked />
        AAA 三態同型（cost–cost–cost）
      </label>

      <label class="option-item">
        <input type="checkbox" id="optABA" checked />
        ABA 原型與過去分詞同型（come–came–come）
      </label>

      <label class="option-item">
        <input type="checkbox" id="optABB" checked />
        ABB 過去式與過去分詞同型（build–built–built）
      </label>

      <label class="option-item">
        <input type="checkbox" id="optComparatives" checked />
        形容詞比較級題目
      </label>
    </div>

    <div class="info">
      小提示：<br />
      勾選哪一類，就會從該類題庫隨機出題。<br />
      之後我們可以在這個版本上加「弱點單字權重」，讓你常錯的單字多出現。
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>三態與比較級練習（分類版）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- PWA / Web App 設定（Android / iOS，全螢幕） -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="style.css" />
  <script src="main.js" defer></script>
</head>
<body>
  <h1>三態與比較級練習</h1>

  <div class="subtitle">
    勾選 AAA／ABA／ABB／ABC(1)／比較級五種題目範圍，每次顯示一個原形。
    按「確認發音(原形)」聽原形，按「顯示三態／比較級」查看完整變化，再按「下一題」換題目。
  </div>

  <div class="card">
    <div class="progress-row">
      <span id="roundStatus">準備開始</span>
      <span id="weakStatus">弱點題：0</span>
    </div>

    <div id="wordBase" class="word-base">—</div>

    <div id="wordMeaning" class="word-meaning">
      請勾選題目範圍後，按「下一題」開始練習。
    </div>

    <div id="forms" class="forms" aria-live="polite"></div>

    <div class="buttons">
      <button class="btn-primary" id="btnSpeakBase" type="button">
        確認發音(原形)
      </button>

      <button class="btn-secondary" id="btnShowForms" type="button">
        顯示三態／比較級
      </button>

      <button class="btn-outline" id="btnNext" type="button">
        下一題
      </button>
    </div>

    <div class="buttons secondary-buttons">
      <button class="btn-warning" id="btnMarkHard" type="button">
        標記弱點
      </button>

      <button class="btn-light" id="btnMarkEasy" type="button">
        已熟悉
      </button>

      <button class="btn-danger" id="btnResetWeak" type="button">
        重設弱點
      </button>
    </div>

    <div id="feedback" class="feedback" aria-live="polite"></div>

    <div class="options">
      <label class="option-item">
        <input type="checkbox" id="optAAA" checked />
        AAA 三態同型（cost–cost–cost）
      </label>

      <label class="option-item">
        <input type="checkbox" id="optABA" checked />
        ABA 原形與過去分詞同型（come–came–come）
      </label>

      <label class="option-item">
        <input type="checkbox" id="optABB" checked />
        ABB 過去式與過去分詞同型（build–built–built）
      </label>

      <label class="option-item">
        <input type="checkbox" id="optABC1" checked />
        ABC(1) 三態皆不同（begin–began–begun）
      </label>

      <label class="option-item">
        <input type="checkbox" id="optComparatives" checked />
        形容詞比較級題目
      </label>
    </div>

    <div class="info">
      <p>
        第一輪會讓所有已勾選的題目各出現一次，而且不會重複。
      </p>
      <p>
        完成第一輪後，系統進入複習模式；被標記為弱點的題目會依權重提高出現機率。
      </p>
      <p>
        「標記弱點」會讓目前題目權重 +1，最高為 5；「已熟悉」會讓權重 -1。
      </p>
    </div>
  </div>
</body>
</html>
